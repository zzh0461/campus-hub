# ==================== 服务器配置 ====================
server:
  # 认证服务监听端口
  port: 8081

# ==================== Spring 配置 ====================
spring:
  # Spring Boot 应用名称，同时也是 Nacos 服务发现中的服务名
  application:
    name: campus-auth-service

  # Nacos 配置中心导入配置
  config:
    # 从 Nacos 加载认证服务的业务配置；optional 表示 Nacos 配置不存在时允许继续启动
    # refreshEnabled=true 表示允许配置动态刷新
    import: optional:nacos:campus-auth-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  # Spring Cloud 配置
  cloud:
    # Nacos 相关配置
    nacos:
      # Nacos 配置中心连接配置；这些配置必须留在本地或环境变量，不能依赖 Nacos 自己提供
      config:
        # Nacos 配置中心地址；未设置 NACOS_ADDR 时使用 127.0.0.1:8848
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # Nacos 配置中心登录用户名；未设置时使用 nacos
        username: ${NACOS_USERNAME:nacos}
        # Nacos 配置中心登录密码；未设置时使用 nacos
        password: ${NACOS_PASSWORD:nacos}
      # Nacos 服务发现连接配置
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      # Nacos 服务发现登录用户名
      username: ${NACOS_USERNAME:nacos}
      # Nacos 服务发现登录密码
      password: ${NACOS_PASSWORD:nacos}
      # Nacos 服务注册与发现配置
      discovery:
        # Nacos 服务注册中心地址
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # 注册到 Nacos 的服务实例 IP：本地开发可留空由框架自动探测；
      # 多网卡环境建议显式指定可回连地址，换网络时用环境变量 NACOS_REGISTER_IP 覆盖
        ip: ${NACOS_REGISTER_IP:0.0.0.0}
        # Nacos 服务所属分组；网关和各服务使用同一个分组才能正常发现
        group: DEFAULT_GROUP

