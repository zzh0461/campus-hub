# ============================================================
# CampusHub 通知服务 campus-notification-service
# 本文件只放"启动引导"配置：服务名、端口、如何连 Nacos
# 数据库 / Redis / RabbitMQ / MyBatis-Plus 等业务配置
# 统一放在 Nacos 上的 campus-notification-service.yaml
# ============================================================

server:
  # 通知服务端口（网关 8080、认证 8081、用户 8083、市场 8084，这里用 8085）
  port: 8085

spring:
  application:
    # 服务名，必须和网关路由里的 lb://campus-notification-service 一致
    name: campus-notification-service

  # 从 Nacos 配置中心导入业务配置（optional：Nacos 上暂时没有也允许启动，方便本地调试）
  config:
    import: optional:nacos:campus-notification-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      # 配置中心连接信息（必须留在本地，不能依赖 Nacos 自己提供）
      config:
        server-addr: ${NACOS_ADDR:0.0.0.0:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
      # 服务发现连接信息
      server-addr: ${NACOS_ADDR:0.0.0.032:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:0.0.0.032:8848}
        # 注册到 Nacos 的 IP：本地开发可留空由框架自动探测；
        # 多网卡环境建议显式指定可回连地址，换网络时用环境变量 NACOS_REGISTER_IP 覆盖
        ip: ${NACOS_REGISTER_IP:0.0.0.0}
        group: DEFAULT_GROUP