spring:
  # 数据源：连接 campus_activity 库
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:0.0.0.0}:3306/campus_activity?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:0.0.0.0}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

  rabbitmq:
    host: 0.0.0.0
    port: 5672
    username: admin
    password: 123456

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 数据库下划线命名 ↔ Java 驼峰命名 自动映射
    map-underscore-to-camel-case: true
    # 开发环境把执行的 SQL 打印到控制台，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志级别
logging:
  level:
    com.campushub: debug