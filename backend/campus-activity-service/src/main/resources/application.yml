# ============================================================
# CampusHub 活动服务 campus-activity-service
# 本文件只放"启动引导"配置：服务名、端口、如何连 Nacos
# 数据库 / MyBatis-Plus / RabbitMQ 等业务配置放在 Nacos 上的 campus-activity-service.yaml
# ============================================================

server:
  # 活动服务端口（网关 8080、认证 8081、用户 8083、市场 8084、通知 8085，这里用 8086）
  port: 8086

spring:
  application:
    # 服务名，必须和网关路由里的 lb://campus-activity-service 一致
    name: campus-activity-service

  # 从 Nacos 配置中心导入业务配置（optional：Nacos 上暂时没有也允许启动，方便本地调试）
  config:
    import: optional:nacos:campus-activity-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      # 配置中心连接信息（必须留在本地，不能依赖 Nacos 自己提供）
      config:
        server-addr: ${NACOS_ADDR:0.0.0.0:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
      # 服务发现连接信息
      server-addr: ${NACOS_ADDR:0.0.0.0:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:0.0.0.0:8848}
        # 注册到 Nacos 的 IP：本地开发可留空由框架自动探测；
        # 多网卡环境建议显式指定可回连地址，换网络时用环境变量 NACOS_REGISTER_IP 覆盖
        ip: ${NACOS_REGISTER_IP:0.0.0.0}
        group: DEFAULT_GROUP

    # 开启 Feign 断路器：只有打开这个开关，UserClient 的 fallback 降级才会生效
    openfeign:
      circuitbreaker:
        enabled: true

# Resilience4j 超时配置：断路器默认超时仅 1 秒，批量查用户偶发慢查询会被误判失败，放宽到 5 秒
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 5s